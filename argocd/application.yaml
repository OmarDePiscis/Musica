apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: music-platform
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/TU_USUARIO/music-platform.git
    targetRevision: HEAD
    path: overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: music
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
